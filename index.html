<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050507">

<title>Gustav Archive — Qris All Payment</title>

<style>
:root {
    --bg: #050507;
    --card: rgba(18, 18, 24, 0.78);
    --border: rgba(255,255,255,.09);
    --white: #f7f7fa;
    --gray: #9a9aa7;
    --purple: #9b6cff;
    --purple-soft: rgba(155,108,255,.12);
    --ease: cubic-bezier(.22,1,.36,1);
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--white);
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    overflow-x: hidden;
}

/* =========================
   BACKGROUND
========================= */

.network {
    position: fixed;
    inset: 0;
    z-index: -10;
    overflow: hidden;
    background: #050507;
}

.network::before {
    content: "";
    position: absolute;
    width: 320px;
    height: 320px;
    left: -140px;
    top: 15%;
    border-radius: 50%;
    background: #7041d9;
    filter: blur(100px);
    opacity: .12;
    animation: glowOne 14s ease-in-out infinite;
}

.network::after {
    content: "";
    position: absolute;
    width: 360px;
    height: 360px;
    right: -170px;
    bottom: 5%;
    border-radius: 50%;
    background: #5c35bb;
    filter: blur(110px);
    opacity: .10;
    animation: glowTwo 17s ease-in-out infinite;
}

.grid {
    position: absolute;
    inset: -30%;
    opacity: .10;

    background-image:
        linear-gradient(
            rgba(155,108,255,.08) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(155,108,255,.08) 1px,
            transparent 1px
        );

    background-size: 80px 80px;

    transform:
        perspective(700px)
        rotateX(60deg)
        translateY(25%);
}

.nodes {
    position: absolute;
    inset: 0;

    background-image:
        radial-gradient(
            circle,
            rgba(255,255,255,.38) 1px,
            transparent 1.5px
        );

    background-size: 74px 74px;

    opacity: .08;

    animation: nodeMove 22s linear infinite;
}

@keyframes glowOne {
    50% {
        transform: translate(80px, 35px);
    }
}

@keyframes glowTwo {
    50% {
        transform: translate(-60px, -45px);
    }
}

@keyframes nodeMove {
    to {
        transform: translate(37px,37px);
    }
}

/* =========================
   LAYOUT
========================= */

.container {
    width: min(960px, calc(100% - 28px));
    margin: auto;
}

.page {
    animation: pageEnter .65s var(--ease);
}

@keyframes pageEnter {
    from {
        opacity: 0;
        transform: translateY(12px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* =========================
   HEADER
========================= */

header {
    height: 76px;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
}

.logo {
    width: 37px;
    height: 37px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 1px solid var(--border);
    border-radius: 12px;

    background: rgba(255,255,255,.035);

    box-shadow:
        0 0 25px rgba(155,108,255,.12);
}

.logo-dot {
    width: 12px;
    height: 12px;

    border-radius: 4px;

    background: var(--purple);

    box-shadow:
        0 0 18px rgba(155,108,255,.65);
}

.brand-name {
    font-size: 14px;
    font-weight: 750;
}

.brand-sub {
    margin-top: 2px;
    color: var(--gray);
    font-size: 11px;
}

.profile {
    width: 40px;
    height: 40px;

    border-radius: 50%;

    border: 1px solid var(--border);
    background: rgba(255,255,255,.035);

    color: #ddd;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    transition:
        transform .22s var(--ease),
        background .22s,
        border-color .22s;
}

.profile:hover {
    border-color: rgba(155,108,255,.35);
    background: var(--purple-soft);
}

.profile:active {
    transform: scale(.88);
}

/* =========================
   HERO
========================= */

main {
    padding: 48px 0 70px;
}

.eyebrow {
    color: #858491;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .15em;
    margin-bottom: 14px;
}

h1 {
    margin: 0;

    font-size: clamp(40px, 8vw, 72px);
    line-height: .98;

    letter-spacing: -.055em;
    font-weight: 800;
}

.hero-sub {
    margin-top: 15px;

    color: #b7b6c1;
    font-size: 16px;
}

.description {
    max-width: 690px;

    margin: 15px 0 28px;

    color: #8e8d99;

    font-size: 13px;
    line-height: 1.65;
}

/* =========================
   SEARCH
========================= */

.search {
    position: relative;
    margin-bottom: 28px;
}

.search-icon {
    position: absolute;

    left: 16px;
    top: 50%;

    width: 18px;

    transform: translateY(-50%);

    color: #777;
}

.search input {
    width: 100%;
    height: 52px;

    padding: 0 17px 0 45px;

    border-radius: 15px;

    border: 1px solid var(--border);

    outline: none;

    background: rgba(15,15,20,.75);

    color: white;

    font: inherit;
    font-size: 14px;

    transition:
        border-color .25s,
        box-shadow .25s;
}

.search input::placeholder {
    color: #6e6e79;
}

.search input:focus {
    border-color: rgba(155,108,255,.45);

    box-shadow:
        0 0 0 4px rgba(155,108,255,.06);
}

/* =========================
   FEATURES
========================= */

.features {
    display: grid;
    grid-template-columns: repeat(3, 1fr);

    gap: 9px;

    margin-bottom: 34px;
}

.feature {
    padding: 13px 8px;

    text-align: center;

    border-radius: 13px;

    border: 1px solid var(--border);

    background: rgba(255,255,255,.025);

    color: #d8d7df;

    font-size: 10px;
    font-weight: 700;

    letter-spacing: .01em;
}

/* =========================
   QRIS LIST
========================= */

.section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 13px;
}

.section-title {
    font-size: 15px;
    font-weight: 750;
}

.counter {
    color: #70707c;
    font-size: 10px;
}

/*
   SELALU 3 KOLOM
*/
.qris-grid {
    display: grid;

    grid-template-columns:
        repeat(3, minmax(0, 1fr));

    gap: 9px;
}

/* =========================
   QRIS CARD
========================= */

.qris-card {
    position: relative;

    min-width: 0;

    padding: 15px 12px 14px;

    border-radius: 16px;

    border: 1px solid var(--border);

    background:
        linear-gradient(
            rgba(20,20,27,.72),
            rgba(10,10,14,.82)
        );

    box-shadow:
        0 10px 30px rgba(0,0,0,.20);

    cursor: pointer;

    overflow: hidden;

    color: white;

    text-align: left;

    transition:
        transform .22s var(--ease),
        border-color .22s,
        box-shadow .22s;

    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

.qris-card:hover {
    transform: translateY(-2px);

    border-color:
        rgba(155,108,255,.28);

    box-shadow:
        0 14px 35px rgba(0,0,0,.28),
        0 0 25px rgba(125,72,230,.06);
}

.qris-card:active {
    transform: scale(.96);
}

.qris-card::after {
    content: "";

    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            circle at 50% 0,
            rgba(155,108,255,.12),
            transparent 55%
        );

    pointer-events: none;
}

.q-icon {
    width: 32px;
    height: 32px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 10px;

    border: 1px solid rgba(155,108,255,.18);

    background: rgba(155,108,255,.07);

    color: #b99cff;

    font-size: 12px;
    font-weight: 800;

    margin-bottom: 11px;
}

.q-name {
    display: block;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    font-size: 12px;
    font-weight: 750;
}

.q-status {
    display: block;

    margin-top: 5px;

    color: #858591;

    font-size: 10px;
}

.q-arrow {
    position: absolute;

    right: 11px;
    bottom: 12px;

    color: #777;

    font-size: 14px;
}

/* =========================
   RIPPLE
========================= */

.ripple {
    position: absolute;

    border-radius: 50%;

    transform: scale(0);

    background: rgba(170,130,255,.22);

    pointer-events: none;

    animation: ripple .55s ease-out;
}

@keyframes ripple {
    to {
        transform: scale(5);
        opacity: 0;
    }
}

.empty {
    grid-column: 1 / -1;

    padding: 30px;

    text-align: center;

    color: #777;

    border: 1px dashed var(--border);

    border-radius: 15px;
}

/* =========================
   FOOTER
========================= */

footer {
    padding-bottom: 30px;

    text-align: center;

    color: #555;

    font-size: 10px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 520px) {

    .container {
        width: calc(100% - 24px);
    }

    header {
        height: 66px;
    }

    main {
        padding-top: 36px;
    }

    .features {
        gap: 7px;
    }

    .feature {
        padding: 12px 4px;
        font-size: 9px;
    }

    /*
       Tetap 3 kolom di HP
    */
    .qris-grid {
        grid-template-columns:
            repeat(3, minmax(0, 1fr));

        gap: 7px;
    }

    .qris-card {
        padding: 12px 8px;

        border-radius: 14px;
    }

    .q-icon {
        width: 28px;
        height: 28px;

        margin-bottom: 8px;
    }

    .q-name {
        font-size: 10px;
    }

    .q-status {
        font-size: 8px;
    }

    .q-arrow {
        display: none;
    }
}

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation: none !important;
        transition: none !important;
    }
}
</style>
</head>

<body>

<div class="network">
    <div class="grid"></div>
    <div class="nodes"></div>
</div>

<div class="page">

<div class="container">

<header>

    <div class="brand">

        <div class="logo">
            <div class="logo-dot"></div>
        </div>

        <div>
            <div class="brand-name">
                Lionel Gustav
            </div>

            <div class="brand-sub">
                Qris All Payment
            </div>
        </div>

    </div>

    <button
        class="profile"
        id="profileButton"
        aria-label="Profile"
    >

        <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
        >

            <circle
                cx="12"
                cy="8"
                r="3.5"
            />

            <path
                d="M5.5 20c.8-3.2 3.1-5 6.5-5s5.7 1.8 6.5 5"
            />

        </svg>

    </button>

</header>


<main>

    <div class="eyebrow">
        Private Archive
    </div>

    <h1>
        Gustav Archive
    </h1>

    <div class="hero-sub">
        Qris All Payment
    </div>

    <p class="description">
        Web ini bertujuan untuk cek transaksi qris yang dipakai own/asis gustav, menu cv saldo sedang dalam tahap pembuatan.
    </p>


    <!-- SEARCH -->

    <div class="search">

        <svg
            class="search-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
        >

            <circle
                cx="11"
                cy="11"
                r="6.5"
            />

            <path
                d="m16 16 5 5"
            />

        </svg>

        <input
            id="search"
            type="search"
            placeholder="Cari Qris"
            autocomplete="off"
        >

    </div>


    <!-- FEATURES -->

    <div class="features">

        <div class="feature">
            BAYAR QRIS
        </div>

        <div class="feature">
            BUKTI TF NO DELAY
        </div>

        <div class="feature">
            TRANSAKSI NO FAKE
        </div>

    </div>


    <div class="section-head">

        <div class="section-title">
            Daftar QRIS
        </div>

        <div
            class="counter"
            id="counter"
        ></div>

    </div>


    <!-- QRIS -->

    <div
        class="qris-grid"
        id="qrisGrid"
    ></div>

</main>


<footer>
    Gustav Archive · Qris All Payment
</footer>

</div>

</div>


<script>

/*
==================================================
DATA QRIS
==================================================
*/

const qrisData = [

    {
        id: "gustav",
        name: "QRIS GUSTAV"
    },

    {
        id: "noir",
        name: "QRIS NOIR"
    },

    {
        id: "pido",
        name: "QRIS PIDO"
    },

    {
        id: "lea",
        name: "QRIS LEA"
    },

    {
        id: "abil",
        name: "QRIS ABIL"
    },

    {
        id: "gustav2",
        name: "QRIS GUSTAV"
    }

];


/*
==================================================
ELEMENT
==================================================
*/

const grid =
    document.getElementById("qrisGrid");

const search =
    document.getElementById("search");

const counter =
    document.getElementById("counter");


/*
==================================================
RENDER CARD
==================================================
*/

function renderQris(keyword = "") {

    const query =
        keyword.trim().toLowerCase();

    const filtered =
        qrisData.filter(item => {

            return (
                item.name
                    .toLowerCase()
                    .includes(query)
                ||
                item.id
                    .toLowerCase()
                    .includes(query)
            );

        });


    counter.textContent =
        filtered.length + " QRIS";


    if (filtered.length === 0) {

        grid.innerHTML = `
            <div class="empty">
                QRIS tidak ditemukan.
            </div>
        `;

        return;
    }


    grid.innerHTML =
        filtered.map(item => {

            return `

                <button
                    class="qris-card"
                    data-id="${item.id}"
                >

                    <span class="q-icon">
                        Q
                    </span>

                    <span class="q-name">
                        ${item.name}
                    </span>

                    <span class="q-status">
                        READY · STATIC
                    </span>

                    <span class="q-arrow">
                        ↗
                    </span>

                </button>

            `;

        }).join("");

}


/*
==================================================
RIPPLE
==================================================
*/

function createRipple(event) {

    const card =
        event.currentTarget;

    const rect =
        card.getBoundingClientRect();

    const ripple =
        document.createElement("span");

    const size =
        Math.max(
            rect.width,
            rect.height
        );


    ripple.className =
        "ripple";

    ripple.style.width =
        size + "px";

    ripple.style.height =
        size + "px";

    ripple.style.left =
        event.clientX -
        rect.left -
        size / 2 +
        "px";

    ripple.style.top =
        event.clientY -
        rect.top -
        size / 2 +
        "px";


    card.appendChild(ripple);


    setTimeout(() => {

        ripple.remove();

    }, 600);

}


/*
==================================================
CARD CLICK
==================================================
*/

grid.addEventListener(
    "click",
    function(event) {

        const card =
            event.target.closest(
                ".qris-card"
            );

        if (!card) return;


        createRipple({
            currentTarget: card,
            clientX: event.clientX,
            clientY: event.clientY
        });


        const id =
            card.dataset.id;


        setTimeout(() => {

            document.body.style.opacity =
                "0";

            document.body.style.transition =
                "opacity .18s ease";


            setTimeout(() => {

                window.location.href =
                    "qris.html?id=" +
                    encodeURIComponent(id);

            }, 180);

        }, 80);

    }
);


/*
==================================================
SEARCH REALTIME
==================================================
*/

search.addEventListener(
    "input",
    function() {

        renderQris(
            search.value
        );

    }
);


/*
==================================================
PROFILE EFFECT
==================================================
*/

document
    .getElementById("profileButton")
    .addEventListener(
        "click",
        function() {

            this.style.transform =
                "scale(.88)";

            setTimeout(() => {

                this.style.transform =
                    "";

            }, 180);

        }
    );


/*
==================================================
INITIAL LOAD
==================================================
*/

renderQris();

</script>

</body>
</html>
